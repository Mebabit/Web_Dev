    <h1>JaDoh</h1>
    <p>Jadoh is one of the most famous meal in Shillong</p>
    <h2>Ingredients</h2>
    <ul>
      <li>Rice</li>
      <li>Water</li>
      <li>Chicken</li>
      <li>Turmeric</li>
      <li>Salt</li>
    </ul>
    <h2>Instructions</h2>
    <ol>
      <li>Boil a water.</li>
      <li>Add Rice to the boiled water.</li>
      <li>Add the turmeric</li>
      <li>Add the cooked to the boiled water.</li>
      <li>Add Salt.</li>
    </ol>
