<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CatPhotoApp</title>
    </head>
    <body>
        <main>
            <h1>Cat Photo App</h1>
            <sectionh>
                <h2>Cat Photos</h2>
                <p>Every one loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cat</a></p>
                <p>See more <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg" target="_blank">Cat Photos</a> in our gallery</p>
                <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg"><img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute cat"></a>
            </section>
            <section>
                <h2>Cat lists: </h2>
                <h3>Things cat love</h3>
                <ul>
                    <li>Dry fish</ol>
                    <li>Catnip</li>
                    <li>Laser light</li>
                </ul>
                <figure>
                <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg" alt="This is a cat">
                <figcaption>Cat <em>loves</em> dry fish</figcaption>
                </figure>
                <h3>Things cat hate: </h3>
                <ol>
                    <li>Water</li>
                    <li>Noice</li>
                    <li>Other cats</li>
                </ol>
                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg" alt="This is what cats hate">
                    <figcaption>Cat <strong>hates</strong> water</figcaption>
                </figure>
            </section>
        </main>
        <footer>
            <p>NoCopyright - <a href="https://www.freecodecamp.org">freeCodeCamp</a></p>
        </footer>
    </body>
</html>
