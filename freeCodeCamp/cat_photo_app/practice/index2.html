<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CatPhotoApp</title>
    </head>
    <body>
        <main>
            <h1>Cat Photo App</h1>
            <section>
                <h2>Cat Photos</h2>
                <p>Every one loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cats online!</a></p>
                <p>See more <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cat photos</a> in our gallery</p>
                <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg"><img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="Cat Photo"/></a>
            </section>
            <section>
                <h2>Cat lists</h2>
                <h3>Things cats love:</h3>
                <ul>
                    <li>Dry fish</li>
                    <li>Laser light</li>
                    <li>Cat nip</li>
                </ul>
                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="Cat Photo"/>
                    <figcaption>Cat <em>loves</em> dryfish</figcaption>
                </figure>
                <h3>Things cat hate:</h3>
                <ul>
                    <li>Water</li>
                    <li>Thunder</li>
                    <li>Other cats</li>
                </ul>
                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="Cat Photos"/>
                    <figcaption>Cat <strong>hates</strong> other cat</figcaption>
                </figure>
            </section>
            <footer>
                <p>
                    No Copyright - <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg">freeCodeCamp.org</a>
                </p>
            </footer>
        </main>
    </body>
</html>
