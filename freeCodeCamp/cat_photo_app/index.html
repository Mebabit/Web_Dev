<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CatPhotoApp</title>
    </head>
    <body>
        <main>
            <h1>Cat Photo App</h1>
            <section>
                <h2>Cat Photos</h2>
                <p>Everyone loves <a href="images\cute_cat.webp">cute cat</a> online!</p>
                <p>See more <a href="images\cute_cat.webp" target="_blank">cat photos</a> in our gallery</p>
                <a href="https://freecatphotoapp.com"><img src="images/cute_cat.webp" alt="Cat Photos"></a>
            </section>
            <section>
                <h2>Cat Lists</h2>
                <h3>Things Cats Love</h3>
                <ul>
                    <li>Cat nip</li>
                    <li>Laser Pointer</li>
                    <li>lasagna</li>
                </ul>
                <figure>
                    <img src="images/Cat_Loves.jpg" alt="Things Cat Loves">
                    <figcaption>Cats <em>Love</em> Lasagna</figcaption>
                </figure>
            </section>
            <section>
                <h2>Top 3 things cats hates:</h2>
                <ol>
                    <li>Flea treatment</li>
                    <li>Thunder</li>
                    <li>Other cats</li>
                </ol>
                <figure>
                    <img src="images/other_cat.webp">
                    <figcaption>Cat <strong>hate</strong> other cats</figcaption>
                </figure>
            </section>
            <footer>
                <p>
                    No-Copyright - <a href="">freeCodeCamp.org</a></footer>
                </p>
        </main>
    </body>
</html>
